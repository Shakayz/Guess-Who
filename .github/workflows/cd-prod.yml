name: CD — Production

# Only triggered by push to main OR manual dispatch
# Requires manual approval via GitHub environment protection rules
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for this production deployment'
        required: true
      sha_override:
        description: 'Optional — deploy a specific SHA (leave empty for HEAD)'
        required: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # Never cancel in-flight production deploys

permissions:
  contents: read
  packages: write
  id-token: write             # For OIDC with AWS

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: prod-imposter-cluster
  API_SERVICE: prod-imposter-api
  WEB_SERVICE: prod-imposter-web
  API_TASK_FAMILY: prod-imposter-api
  WEB_TASK_FAMILY: prod-imposter-web

jobs:
  # ─────────────────────────────────────────
  # 1. Build & push images tagged :latest + :SHA
  # ─────────────────────────────────────────
  build-push:
    name: Build & Push (prod)
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha_override || github.sha }}

      - id: set-tag
        run: echo "tag=${{ github.event.inputs.sha_override || github.sha }}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Set lowercase repo name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/api:latest
            ghcr.io/${{ env.REPO_LC }}/api:${{ steps.set-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/web:latest
            ghcr.io/${{ env.REPO_LC }}/web:${{ steps.set-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # 2. Manual approval gate
  #    GitHub → Settings → Environments → production → Required reviewers
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Production (ECS)
    runs-on: ubuntu-latest
    needs: build-push
    environment: production    # ← APPROVAL REQUIRED here
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Save current task definitions for rollback
        id: rollback-info
        run: |
          API_TASK=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.API_SERVICE }} \
            --query 'services[0].taskDefinition' \
            --output text)
          WEB_TASK=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.WEB_SERVICE }} \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "api_task=${API_TASK}" >> $GITHUB_OUTPUT
          echo "web_task=${WEB_TASK}" >> $GITHUB_OUTPUT
          echo "Previous API task: ${API_TASK}"
          echo "Previous Web task: ${WEB_TASK}"

      - name: Update API task definition with new image
        id: api-task-def
        run: |
          IMAGE_TAG="${{ needs.build-push.outputs.image_tag }}"

          # Get current task definition, update image, register new revision
          aws ecs describe-task-definition \
            --task-definition ${{ env.API_TASK_FAMILY }} \
            --query 'taskDefinition' \
            --output json | \
          jq --arg TAG "$IMAGE_TAG" \
            '.containerDefinitions[0].image = "ghcr.io/shakayz/guess-who/api:" + $TAG' | \
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            > /tmp/api-task-def.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/api-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "arn=${NEW_ARN}" >> $GITHUB_OUTPUT
          echo "New API task definition: ${NEW_ARN}"

      - name: Update Web task definition with new image
        id: web-task-def
        run: |
          IMAGE_TAG="${{ needs.build-push.outputs.image_tag }}"

          aws ecs describe-task-definition \
            --task-definition ${{ env.WEB_TASK_FAMILY }} \
            --query 'taskDefinition' \
            --output json | \
          jq --arg TAG "$IMAGE_TAG" \
            '.containerDefinitions[0].image = "ghcr.io/shakayz/guess-who/web:" + $TAG' | \
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            > /tmp/web-task-def.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/web-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "arn=${NEW_ARN}" >> $GITHUB_OUTPUT
          echo "New Web task definition: ${NEW_ARN}"

      - name: Deploy API service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.API_SERVICE }} \
            --task-definition ${{ steps.api-task-def.outputs.arn }} \
            --no-cli-pager > /dev/null
          echo "API service update initiated."

      - name: Deploy Web service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.WEB_SERVICE }} \
            --task-definition ${{ steps.web-task-def.outputs.arn }} \
            --no-cli-pager > /dev/null
          echo "Web service update initiated."

      - name: Wait for services to stabilize
        run: |
          echo "Waiting for ECS services to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.API_SERVICE }} ${{ env.WEB_SERVICE }}
          echo "All services stable."

      - name: Health check
        run: |
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name prod-imposter-stack \
            --query 'Stacks[0].Outputs[?OutputKey==`ALBDNSName`].OutputValue' \
            --output text 2>/dev/null || echo "")

          if [ -n "$ALB_DNS" ]; then
            echo "Checking API health at https://${ALB_DNS}..."
            for i in $(seq 1 12); do
              if curl -sf "https://${ALB_DNS}/api/health" > /dev/null 2>&1 || \
                 curl -sf "http://${ALB_DNS}/health" > /dev/null 2>&1; then
                echo "Health check passed."
                exit 0
              fi
              echo "Attempt $i/12 — waiting 10s..."
              sleep 10
            done
            echo "WARNING: Health check could not reach ALB, but ECS services are stable."
          else
            echo "ALB DNS not found via CloudFormation, skipping HTTP health check."
            echo "ECS services are stable — deployment considered successful."
          fi

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed — rolling back..."

          PREV_API="${{ steps.rollback-info.outputs.api_task }}"
          PREV_WEB="${{ steps.rollback-info.outputs.web_task }}"

          if [ -n "$PREV_API" ] && [ "$PREV_API" != "None" ]; then
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service ${{ env.API_SERVICE }} \
              --task-definition "$PREV_API" \
              --no-cli-pager > /dev/null
            echo "API rolled back to: ${PREV_API}"
          fi

          if [ -n "$PREV_WEB" ] && [ "$PREV_WEB" != "None" ]; then
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service ${{ env.WEB_SERVICE }} \
              --task-definition "$PREV_WEB" \
              --no-cli-pager > /dev/null
            echo "Web rolled back to: ${PREV_WEB}"
          fi

          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.API_SERVICE }} ${{ env.WEB_SERVICE }} || true

          echo "Rollback complete."

      - name: Tag release in git
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "release-$(date +'%Y%m%d-%H%M')-${{ needs.build-push.outputs.image_tag }}" || true
          git push --tags || true
