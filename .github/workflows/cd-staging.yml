name: CD — Staging

on:
  push:
    branches: [main, develop, staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-3
  ECR_REPO: 700672899544.dkr.ecr.eu-west-3.amazonaws.com/imposter-api
  S3_BUCKET: aghazzaf-web-staging
  CF_DIST_ID: E1ZIQ7E8U04EBD
  VM_HOST: 35.181.233.160
  ROLE_ARN: arn:aws:iam::700672899544:role/GitHubActionsImposterDeploy

jobs:
  deploy:
    name: Build, push & deploy (staging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @imposter/shared build
          pnpm --filter @imposter/ui build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------- WEB ----------
      - name: Build web
        env:
          VITE_API_URL: https://staging-api.aghazzaf.com
          VITE_SOCKET_URL: https://staging-api.aghazzaf.com
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: pnpm --filter @imposter/web build

      - name: Sync web to S3
        run: |
          aws s3 sync apps/web/dist s3://${{ env.S3_BUCKET }}/ --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp apps/web/dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ env.CF_DIST_ID }} --paths "/*"

      # ---------- API ----------
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Build & push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_REPO }}:staging
            ${{ env.ECR_REPO }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H ${{ env.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Sync compose file & Caddyfile to VM
        run: |
          scp -i ~/.ssh/deploy deploy/docker-compose.staging.yml ubuntu@${{ env.VM_HOST }}:/tmp/docker-compose.staging.yml
          scp -i ~/.ssh/deploy deploy/Caddyfile ubuntu@${{ env.VM_HOST }}:/tmp/Caddyfile
          ssh -i ~/.ssh/deploy ubuntu@${{ env.VM_HOST }} \
            "sudo mkdir -p /opt/imposter \
             && sudo mv /tmp/docker-compose.staging.yml /opt/imposter/docker-compose.staging.yml \
             && sudo mv /tmp/Caddyfile /opt/imposter/Caddyfile"

      - name: Get ECR password
        id: ecr
        run: echo "pw=$(aws ecr get-login-password --region eu-west-3)" >> $GITHUB_OUTPUT

      - name: Deploy to VM
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ALLOWED_ORIGINS: https://staging.aghazzaf.com
          ECR_PW: ${{ steps.ecr.outputs.pw }}
        run: |
          ssh -i ~/.ssh/deploy ubuntu@${{ env.VM_HOST }} \
            "cd /opt/imposter \
             && sudo touch .env && sudo chmod 600 .env \
             && for kv in 'GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}' 'GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}' 'ALLOWED_ORIGINS=${ALLOWED_ORIGINS}'; do \
                  key=\${kv%%=*}; \
                  if sudo grep -q \"^\${key}=\" .env; then \
                    sudo sed -i \"s|^\${key}=.*|\${kv}|\" .env; \
                  else \
                    echo \"\${kv}\" | sudo tee -a .env >/dev/null; \
                  fi; \
                done \
             && echo '${ECR_PW}' | sudo docker login --username AWS --password-stdin 700672899544.dkr.ecr.eu-west-3.amazonaws.com \
             && sudo docker compose -f docker-compose.staging.yml pull api \
             && sudo docker compose -f docker-compose.staging.yml up -d --no-deps api \
             && sudo docker image prune -f"

      - name: Smoke test API
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" https://staging-api.aghazzaf.com/ || true)
            echo "attempt $i: $code"
            [ "$code" != "000" ] && exit 0
            sleep 5
          done
          exit 1
