name: CD — Dev

# Triggered on every push to develop (after CI passes)
on:
  push:
    branches: [develop]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: dev-imposter-cluster
  API_SERVICE: dev-imposter-api
  WEB_SERVICE: dev-imposter-web
  API_TASK_FAMILY: dev-imposter-api
  WEB_TASK_FAMILY: dev-imposter-web

jobs:
  # ─────────────────────────────────────────
  # 1. Build & push Docker images tagged :dev
  # ─────────────────────────────────────────
  build-push:
    name: Build & Push (dev)
    runs-on: ubuntu-latest
    outputs:
      image_tag: dev-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Set lowercase repo name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/api:dev
            ghcr.io/${{ env.REPO_LC }}/api:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/web:dev
            ghcr.io/${{ env.REPO_LC }}/web:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # 2. Deploy to ECS (dev)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Dev (ECS)
    runs-on: ubuntu-latest
    needs: build-push
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update API task definition
        id: api-task-def
        run: |
          IMAGE_TAG="${{ needs.build-push.outputs.image_tag }}"

          aws ecs describe-task-definition \
            --task-definition ${{ env.API_TASK_FAMILY }} \
            --query 'taskDefinition' \
            --output json | \
          jq --arg TAG "$IMAGE_TAG" \
            '.containerDefinitions[0].image = "ghcr.io/shakayz/guess-who/api:" + $TAG' | \
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            > /tmp/api-task-def.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/api-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "arn=${NEW_ARN}" >> $GITHUB_OUTPUT
          echo "New API task: ${NEW_ARN}"

      - name: Update Web task definition
        id: web-task-def
        run: |
          IMAGE_TAG="${{ needs.build-push.outputs.image_tag }}"

          aws ecs describe-task-definition \
            --task-definition ${{ env.WEB_TASK_FAMILY }} \
            --query 'taskDefinition' \
            --output json | \
          jq --arg TAG "$IMAGE_TAG" \
            '.containerDefinitions[0].image = "ghcr.io/shakayz/guess-who/web:" + $TAG' | \
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            > /tmp/web-task-def.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/web-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "arn=${NEW_ARN}" >> $GITHUB_OUTPUT
          echo "New Web task: ${NEW_ARN}"

      - name: Deploy ECS services
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.API_SERVICE }} \
            --task-definition ${{ steps.api-task-def.outputs.arn }} \
            --no-cli-pager > /dev/null

          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.WEB_SERVICE }} \
            --task-definition ${{ steps.web-task-def.outputs.arn }} \
            --no-cli-pager > /dev/null

          echo "ECS services updated."

      - name: Wait for services to stabilize
        run: |
          echo "Waiting for ECS services to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.API_SERVICE }} ${{ env.WEB_SERVICE }}
          echo "Dev deployed — SHA: ${{ github.sha }}"
