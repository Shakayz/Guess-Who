AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GitHub Actions OIDC provider + IAM deploy role for Red Handed (Guess-Who).
  Lets GitHub Actions from Shakayz/Guess-Who assume GitHubActionsRedHandedDeploy
  via sts:AssumeRoleWithWebIdentity without long-lived AWS credentials.

  Simplified for the Lightsail-only architecture: the role only needs ECR
  push/pull permissions. Web is served from a container on Lightsail (no S3,
  no CloudFront).

Parameters:
  GitHubOrg:
    Type: String
    Default: Shakayz
    Description: >
      GitHub organization / user that owns the repo. Case-sensitive — GitHub
      OIDC "sub" claims preserve the exact case registered on GitHub, and
      AWS IAM StringLike matching is case-sensitive.

  GitHubRepo:
    Type: String
    Default: Guess-Who
    Description: >
      GitHub repository name. Case-sensitive (see GitHubOrg).

  RoleName:
    Type: String
    Default: GitHubActionsRedHandedDeploy
    Description: Name of the IAM role that the CD workflows assume

  ApiEcrRepositoryArn:
    Type: String
    Default: arn:aws:ecr:eu-west-3:210884642211:repository/red-handed-api
    Description: ARN of the ECR repo for the API image

  WebEcrRepositoryArn:
    Type: String
    Default: arn:aws:ecr:eu-west-3:210884642211:repository/red-handed-web
    Description: ARN of the ECR repo for the Web image

  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >
      Set to "false" if the account already has the
      token.actions.githubusercontent.com OIDC provider (AWS only allows one
      per account). Setting "true" will create it.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  # ─────────────────────────────────────────────────────────────
  # OIDC identity provider for GitHub Actions
  # ─────────────────────────────────────────────────────────────
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # ─────────────────────────────────────────────────────────────
  # IAM role assumed by the CD workflows via OIDC
  # ─────────────────────────────────────────────────────────────
  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: >
        Assumed by GitHub Actions (Shakayz/Guess-Who) via OIDC to push
        Red Handed API/Web images to ECR.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/*
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:environment:production
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:environment:staging
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:pull_request
      Policies:
        - PolicyName: EcrPushPull
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:GetLifecyclePolicy
                  - ecr:GetRepositoryPolicy
                  - ecr:InitiateLayerUpload
                  - ecr:ListImages
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !Ref ApiEcrRepositoryArn
                  - !Ref WebEcrRepositoryArn

Outputs:
  DeployRoleArn:
    Description: ARN of the IAM role the CD workflows assume (ROLE_ARN in the workflows)
    Value: !GetAtt GitHubActionsDeployRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-DeployRoleArn

  OidcProviderArn:
    Description: ARN of the GitHub OIDC identity provider
    Condition: ShouldCreateOidcProvider
    Value: !Ref GitHubOidcProvider
    Export:
      Name: !Sub ${AWS::StackName}-OidcProviderArn
