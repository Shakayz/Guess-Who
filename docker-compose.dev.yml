name: red-handed-dev
# ── Full development stack ─────────────────────────────────────────────────────
# Usage:
#   docker compose -f docker-compose.dev.yml up          # start everything
#   docker compose -f docker-compose.dev.yml up postgres redis  # infra only
#   docker compose -f docker-compose.dev.yml build api   # rebuild after shared/ changes
#
# Hot-reload:
#   • API  — tsx watch picks up changes in apps/api/src/
#   • Web  — Vite HMR picks up changes in apps/web/src/
#   • packages/shared — requires `docker compose build api web` to rebuild
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: red-handed-postgres-dev
    environment:
      POSTGRES_DB:       red_handed_dev
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: red-handed-redis-dev
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── API (Fastify + Socket.IO) ────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: red-handed-api-dev
    # Override localhost URLs from apps/api/.env with Docker service names
    env_file:
      - path: apps/api/.env
        required: false   # optional — env vars below take precedence
    environment:
      NODE_ENV:     development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/red_handed_dev
      REDIS_URL:    redis://redis:6379
      JWT_SECRET:   ${JWT_SECRET:-dev-only-secret-please-change-in-production-123}
      ALLOWED_ORIGINS: >-
        http://localhost:5173,http://localhost:19006,https://sonly-unanimating-gemma.ngrok-free.dev
    ports:
      - "3001:3001"
    volumes:
      # Hot-reload: mount source so tsx watch sees file changes
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      # Shared package — mount src + dist so host rebuilds are visible without a
      # full image rebuild. After editing packages/shared, run
      #   pnpm --filter @red-handed/shared build
      # on the host (or inside the container), then `docker restart red-handed-api-dev`.
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/shared/dist:/app/packages/shared/dist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Web (Vite dev server) ────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: red-handed-web-dev
    environment:
      # Used by vite.config.ts to proxy /api and /socket.io to the api container
      API_TARGET: http://api:3001
      VITE_GOOGLE_CLIENT_ID: 358295814462-f9098rilnci6d8dkdhkofo02l12ukqm5.apps.googleusercontent.com
    ports:
      - "5173:5173"
      - "5174:5173"
    volumes:
      # Hot-reload: mount source so Vite HMR sees file changes
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      # Shared package source — after editing, rebuild dist with
      #   docker exec red-handed-web-dev pnpm --filter @red-handed/shared build
      # then restart red-handed-web-dev so Vite reloads the bundle.
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_dev_data:
  redis_dev_data:
