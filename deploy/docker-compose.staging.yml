version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres
      -c shared_buffers=32MB
      -c work_mem=2MB
      -c maintenance_work_mem=16MB
      -c effective_cache_size=64MB
      -c max_connections=20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 96M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 48M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: ${API_IMAGE}
    restart: always
    # Staging: skip the heavy seed step (prod still seeds via default CMD).
    #
    # Before `migrate deploy`, we unstick any wedged migration state so the
    # container does not crash-loop on restart. Three cases we clean up:
    #   1. Rows with `finished_at IS NULL` — a migration that errored mid-apply
    #      leaves `_prisma_migrations` in a "failed" state. `migrate deploy`
    #      refuses to proceed until someone resolves it, so every subsequent
    #      boot returns 502 through Caddy.
    #   2. The old `20260418050000_purchase_platform_fields` name — now
    #      renamed to `20260419010000_...`. If staging recorded the old name,
    #      `migrate deploy` sees "applied migration not in folder" (drift) and
    #      aborts.
    #   3. The new `20260419010000_purchase_platform_fields` row — cleared so
    #      the now-idempotent migration re-runs from a known state
    #      (`ALTER TABLE ... IF NOT EXISTS` makes re-applying a no-op if the
    #      columns/indexes already exist, and avoids the
    #      "migration modified after applied" checksum error).
    # All three are cleared best-effort (|| true) so a fresh DB — where
    # `_prisma_migrations` does not yet exist — boots normally.
    command:
      - "sh"
      - "-c"
      - |
        echo "DELETE FROM \"_prisma_migrations\" WHERE finished_at IS NULL OR migration_name IN ('20260418050000_purchase_platform_fields', '20260419010000_purchase_platform_fields');" \
          | prisma db execute --stdin --schema prisma/schema.prisma 2>/dev/null || true
        prisma migrate deploy && node dist/index.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=180"
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: "7d"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL}
      STRIPE_PRICE_ID_PACK_500: ${STRIPE_PRICE_ID_PACK_500}
      STRIPE_PRICE_ID_PACK_1500: ${STRIPE_PRICE_ID_PACK_1500}
      STRIPE_PRICE_ID_PACK_5000: ${STRIPE_PRICE_ID_PACK_5000}
      STRIPE_PRICE_ID_PREMIUM_MONTHLY: ${STRIPE_PRICE_ID_PREMIUM_MONTHLY}
      STRIPE_PRICE_ID_PREMIUM_YEARLY: ${STRIPE_PRICE_ID_PREMIUM_YEARLY}
      STRIPE_PORTAL_RETURN_URL: ${STRIPE_PORTAL_RETURN_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
    deploy:
      resources:
        limits:
          memory: 220M
    expose:
      - "3001"

  web:
    image: ${WEB_IMAGE}
    restart: always
    deploy:
      resources:
        limits:
          memory: 48M
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      WEB_DOMAIN: ${WEB_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 48M
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
