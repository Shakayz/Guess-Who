version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres
      -c shared_buffers=32MB
      -c work_mem=2MB
      -c maintenance_work_mem=16MB
      -c effective_cache_size=64MB
      -c max_connections=20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 96M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 48M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: ${API_IMAGE}
    restart: always
    # Staging: skip the heavy seed step (prod still seeds via default CMD).
    #
    # Before `migrate deploy`, unstick any wedged `_prisma_migrations` rows so
    # the container does not crash-loop through Caddy as 502 on /health. Three
    # rows need clearing after the 20260418050000 → 20260419010000 → 20260419020000
    # rename churn for purchase_platform_fields:
    #   1. Any row with `finished_at IS NULL` — a migration that errored
    #      mid-apply (Prisma refuses to proceed until such a row is resolved).
    #   2. `20260418050000_purchase_platform_fields` — first shipped name, now
    #      gone from the folder. Leaving the row means "applied migration not
    #      in folder" drift.
    #   3. `20260419010000_purchase_platform_fields` — second name, also gone
    #      from the folder (renamed again to dodge a checksum mismatch
    #      introduced by #65). Same drift problem if we leave the row.
    # Afterwards, the renamed `20260419020000_purchase_platform_fields`
    # migration is applied fresh. Its DDL is idempotent (IF NOT EXISTS) so it
    # is a no-op on a DB where the columns were created by an earlier
    # non-idempotent run, and a real apply on a fresh DB.
    #
    # Wrapped in `|| true` so a fresh DB (no `_prisma_migrations` table yet)
    # boots normally. Stderr is intentionally left visible so a real prisma
    # error shows up in the container logs — swallowing it (as #65 did with
    # `2>/dev/null`) hid the actual failure during the last regression.
    command:
      - "sh"
      - "-c"
      - |
        echo "DELETE FROM \"_prisma_migrations\" WHERE finished_at IS NULL OR migration_name IN ('20260418050000_purchase_platform_fields', '20260419010000_purchase_platform_fields');" \
          | prisma db execute --stdin --schema prisma/schema.prisma || true
        prisma migrate deploy && exec node dist/index.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=180"
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: "7d"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL}
      STRIPE_PRICE_ID_PACK_500: ${STRIPE_PRICE_ID_PACK_500}
      STRIPE_PRICE_ID_PACK_1500: ${STRIPE_PRICE_ID_PACK_1500}
      STRIPE_PRICE_ID_PACK_5000: ${STRIPE_PRICE_ID_PACK_5000}
      STRIPE_PRICE_ID_PREMIUM_MONTHLY: ${STRIPE_PRICE_ID_PREMIUM_MONTHLY}
      STRIPE_PRICE_ID_PREMIUM_YEARLY: ${STRIPE_PRICE_ID_PREMIUM_YEARLY}
      STRIPE_PORTAL_RETURN_URL: ${STRIPE_PORTAL_RETURN_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
    deploy:
      resources:
        limits:
          memory: 220M
    expose:
      - "3001"

  web:
    image: ${WEB_IMAGE}
    restart: always
    deploy:
      resources:
        limits:
          memory: 48M
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      WEB_DOMAIN: ${WEB_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 48M
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
