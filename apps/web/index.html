<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/masks.png" />
    <link rel="apple-touch-icon" href="/masks.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Red Handed" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Red Handed ! — The ultimate social deduction game" />
    <title>Red Handed !</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Apple SDK is configured at runtime via AppleID.auth.init() in AuthPage so the
         redirect URI tracks window.location.origin (prod vs staging) and the Services
         ID can rotate via VITE_APPLE_CLIENT_ID without a code change. -->
    <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js" async defer></script>
    <!-- AdSense script is injected at runtime from src/lib/ads.ts only when
         VITE_ADSENSE_CLIENT is configured, so unset envs never trigger a
         malformed-URL fetch. -->
  </head>
  <body class="bg-neutral-950 text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
