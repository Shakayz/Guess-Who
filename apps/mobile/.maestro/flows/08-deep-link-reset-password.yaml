# Flow 08 — Deep link: password reset
#
# When a user taps the password-reset email on their device, it opens
# redhanded://reset-password?token={resetToken}. The deep link handler in
# app/_layout.tsx parses the URL and routes to /reset-password?token=xxx.
#
# We test that the deep link lands on the reset screen with form fields
# rendered. We do NOT submit the form — it would call the API with a fake
# token.

appId: ${APP_ID:-com.redhanded.game}
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Red Handed"
    timeout: 15000

# Fire the deep link. The reset-password screen expects ?token=xxx in
# the URL — we use a placeholder, which is fine because we don't submit.
- openLink: "redhanded://reset-password?token=e2e-fake-token"

# Reset-password screen renders. Its strings mostly don't have English
# translations (they fall back to raw keys), but the password inputs are
# always there.
- extendedWaitUntil:
    visible: "Password"
    timeout: 5000
