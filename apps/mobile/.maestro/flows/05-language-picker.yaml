# Flow 05 — Language picker
#
# Opens the language picker modal on the auth screen (top-right flag button),
# switches to French, and verifies that a known string has been translated.
# Then switches back to English.
#
# Depends on:
#   - packages/shared/src/i18n/en.ts   (English strings)
#   - packages/shared/src/i18n/fr.ts   (French strings)
# The "Play Offline" button becomes "Jouer Hors Ligne" in French (fr.ts).

appId: ${APP_ID:-com.imposter.game}
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Imposter Game"
    timeout: 15000

- assertVisible: "Play Offline"

# Open language picker via its testID (the trigger is a flag emoji + chevron —
# text matching is not reliable).
- tapOn:
    id: "language-picker-trigger"

# The modal's header is t('auth.language') → "Language".
- extendedWaitUntil:
    visible: "Language"
    timeout: 3000

# Pick French. The modal renders each language as its localized label.
- tapOn: "Français"

# Modal closes; verify the Play Offline copy is now French.
- extendedWaitUntil:
    visible: "Jouer Hors Ligne"
    timeout: 3000
- assertNotVisible: "Play Offline"

# Restore English so subsequent flows see expected copy.
- tapOn:
    id: "language-picker-trigger"
- tapOn: "English"
- extendedWaitUntil:
    visible: "Play Offline"
    timeout: 3000
