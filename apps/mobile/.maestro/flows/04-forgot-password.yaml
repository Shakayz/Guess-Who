# Flow 04 — Forgot-password navigation
#
# Confirms the "Forgot password?" link routes to /forgot-password and the
# screen renders its input and submit button. We do NOT submit the form —
# that would call POST /auth/forgot-password and we want this flow to run
# without a backend.

appId: ${APP_ID:-com.redhanded.game}
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Red Handed"
    timeout: 15000

- tapOn: "Forgot password?"

# The forgot-password screen uses t('auth.forgotPassword') as its title —
# which resolves to "Forgot password?" from packages/shared/src/i18n/en.ts.
#
# NOTE: forgot-password.tsx also references auth.forgotPasswordDesc,
# auth.resetLinkSent, auth.sendResetLink, auth.backToLogin — none of which
# exist in en.ts. Those will render as their raw key until the strings are
# added. See docs/e2e-mobile.md for the open issue.
- extendedWaitUntil:
    visible: "Forgot password?"
    timeout: 5000
- assertVisible: "Email"

# Go back and verify we land on the auth screen again.
- back
- assertVisible: "Sign In"
